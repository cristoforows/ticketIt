      type: object
      description: The fixed GET /api/status payload.
      additionalProperties: false
      required: [application, status, version, environment, startedAt, database]
      properties:
        application:
          type: string
          const: galley
        status:
          type: string
          const: ok
        version:
          type: string
          description: Galley's configured version string (GALLEY_VERSION).
        environment:
          type: string
          enum: [development, production]
        startedAt:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp, captured once at process start.
          # Keeps this a Go string. Left alone, date-time maps to
          # time.Time, whose RFC3339Nano marshaling can add fractional
          # seconds and change the response bytes.
          x-go-type: string
        database:
          $ref: "#/components/schemas/DatabaseStatus"
    DatabaseStatus:
      type: object
      description: >-
        Added by issue #52. Reachability and applied migration version,
        checked live on every request -- never cached from process
        start, and never reported as "ok" when the database is
        unreachable.
      additionalProperties: false
      required: [status, migrationVersion]
      properties:
        status:
          type: string
          enum: [ok, error]
        migrationVersion:
          type: [integer, "null"]
          description: >-
            The most recently applied forward-only migration version
            (see apps/galley/internal/migrations), or null if it could
            not be determined -- either because the database is
            unreachable (status "error") or because no migration has
            been applied yet on an otherwise-reachable database
            (status "ok").
        error:
          type: string
          description: >-
            Present only when status is "error". A short, fixed,
            non-secret explanation -- never the underlying driver error
            text or any part of the connection string.

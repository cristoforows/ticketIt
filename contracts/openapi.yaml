      type: string
      description: >-
        A Ticket's lifecycle stage (CONTEXT.md, "Status"). Moves
        between these values are validated against the persisted
        current Status per D3 S2
        (docs/decisions/d3-agent-template-compatibility.md). `Done` is
        reachable only through explicit Accept.
      enum: [Backlog, Ready, InProgress, Blocked, InReview, Done]

            every grant approved on this Ticket, and every `time` grant
            of the Ticket's assigned Agent.
          items:
            $ref: "#/components/schemas/PermissionGrant"
        permissionGrantCount:
          type: integer
          minimum: 0
          description: How many grants apply to this Ticket; more than `permissionGrants` holds when it is truncated.
        completionCondition:
          $ref: "#/components/schemas/TicketCompletionCondition"
        goal:
          type: string
          description: >-
            Manual refinement (issue #58, docs/ticket-creation.md,
            "Manual guidance" -- prompt "What outcome do you want?").
            Plain text, never Markdown (M7 owns report rendering).
            Always present on the wire; "" means never set or cleared
            -- read access never distinguishes those two, only PATCH's
            request body does (see UpdateTicketRequest).
        context:
          type: string
          description: >-

      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id: {type: string, format: uuid, x-go-type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time, x-go-type: string}
    BadgeList:
      type: object
      additionalProperties: false
      required: [badges]
      properties:
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
    CreateBadgeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
    TicketAllowedActions:
      type: object
      additionalProperties: false
      required: [statusChanges, statusChangeRejections, accept, rework, stop]
      properties:
        statusChanges:
          type: array
          description: Targets accepted by a plain status command from this Ticket's current Status.
          items:
            $ref: "#/components/schemas/TicketStatus"
        statusChangeRejections:
          type: array
          description: >-
            Targets D3 S2's table permits from the current Status that
            this Ticket's Agent assignment or missing inputs rule out,
            each with the status command's error.
          items:
            $ref: "#/components/schemas/TicketStatusChangeRejection"
        accept:
          $ref: "#/components/schemas/TicketCommandAvailability"
        rework:
          $ref: "#/components/schemas/TicketCommandAvailability"
        stop:
          description: Unavailable with `stop_already_requested` once Stop is requested.
          $ref: "#/components/schemas/TicketCommandAvailability"
    TicketStatusChangeRejection:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
        reason:
          $ref: "#/components/schemas/ErrorDetail"
    TicketCommandAvailability:
      type: object
      additionalProperties: false
      required: [available]
      not:
        anyOf:
          - properties:
              available:
                const: false
            not:
              required: [reason]
          - properties:
              available:
                const: true
            required: [reason]
      properties:
        available:
          type: boolean
        reason:
          description: Required when unavailable; absent when available. Matches the command's error.
          $ref: "#/components/schemas/ErrorDetail"
    CreateTicketRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          description: >-
            Trimmed of leading/trailing whitespace before validation.
            Must be non-empty and at most 200 characters after
            trimming.
          minLength: 1
          maxLength: 200
        template:
          $ref: "#/components/schemas/TicketTemplate"
        goal:
          type: string
          description: Same trimming and limit as `UpdateTicketRequest.goal`; omitted or empty leaves it unset.
          maxLength: 2000
        context:
          type: string
          description: Same as `goal`.
          maxLength: 10000
        successCriteria:
          type: string
          description: Same as `goal`.
          maxLength: 2000
        constraints:
          type: string
          description: Same as `goal`.
          maxLength: 2000
        repository:
          type: string
          description: Same as `goal`.
          maxLength: 500
    UpdateTicketRequest:
      type: object
      description: >-
        Manual refinement (issue #58): a genuine partial update. Every
        property is optional -- none are listed under `required` -- so
        a client can distinguish "this property was not part of the
        request" (leave unchanged) from "this property was sent as an
        empty string" (clear it, title excepted). See the `patch
        /api/tickets/{id}` operation above for the full rule, including
        why title cannot be cleared, and apps/galley/README.md, "Manual
        refinement fields," for the concurrent-edit (last-write-wins)
        rule. Trimmed of leading/trailing whitespace the same way
        CreateTicketRequest.title is; the maxLength values below apply
        after trimming and are counted in characters (code points), not
        bytes -- see apps/galley/README.md, "Tickets," "Title
        validation."
      additionalProperties: false
      properties:
        title:
          type: string
          description: >-
            If present, trimmed and validated exactly like
            CreateTicketRequest.title. A value that trims to empty is
            rejected with invalid_request rather than clearing the
            title -- every Ticket must keep one. Absent leaves the
            title unchanged.
          maxLength: 200
        goal:
          type: string
          description: >-
            Manual guidance: "What outcome do you want?"
            (docs/ticket-creation.md). Absent leaves the stored value
            unchanged; present as "" (or a value that trims to "")
            clears it; present with text trims and stores it.
          maxLength: 2000
        context:
          type: string
          description: >-
            Manual guidance: "Supply relevant background, links,
            repositories, or examples." Same absent/empty/text rule as
            `goal`.
          maxLength: 10000
        successCriteria:
          type: string
          description: >-
            Manual guidance: "Describe observable conditions that
            demonstrate the outcome was achieved." Same
            absent/empty/text rule as `goal`. Agent-readiness
            validation of this field is M4's, not this slice's.
          maxLength: 2000
        constraints:
          type: string
          description: >-
            Manual guidance: "State what must stay unchanged or remain
            out of scope." Same absent/empty/text rule as `goal`.
          maxLength: 2000
        repository:
          type: string
          description: >-
            One Ticket repository reference (issue #59, D3), available
            on either Template. Same absent/empty/text rule as `goal`.
          maxLength: 500
        # Never accepted: naming this property at all -- present with
        # any value, including the Ticket's current one -- is rejected
        # with invalid_request. Changing a Ticket's Template after
        # creation is out of scope for M2 (D4, M8). See the
        # `patch /api/tickets/{id}` operation description above.
        template:
          $ref: "#/components/schemas/TicketTemplate"
    ChangeTicketStatusRequest:
      type: object
      description: >-
        `status` names the requested target Status, validated against
        the Ticket's persisted current Status per D3 S2. `Done` is
        always rejected here -- see `POST /api/tickets/{id}/accept`.
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
    ReorderTicketRequest:
      type: object
      description: Exactly one of `before` or `after`.
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        before: {type: string, format: uuid, x-go-type: string}
        after: {type: string, format: uuid, x-go-type: string}
    StatusResponse:
      type: object
      description: The fixed GET /api/status payload.
      additionalProperties: false
      required: [application, status, version, environment, startedAt, database]
      properties:
        application:
          type: string
          const: galley
        status:
          type: string
          const: ok
        version:
          type: string
          description: Galley's configured version string (GALLEY_VERSION).
        environment:
          type: string
          enum: [development, production]
        startedAt:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp, captured once at process start.
          # Keeps this a Go string. Left alone, date-time maps to
          # time.Time, whose RFC3339Nano marshaling can add fractional
          # seconds and change the response bytes.
          x-go-type: string
        database:
          $ref: "#/components/schemas/DatabaseStatus"
    DatabaseStatus:
      type: object
      description: >-
        Added by issue #52. Reachability and applied migration version,
        checked live on every request -- never cached from process
        start, and never reported as "ok" when the database is
        unreachable.
      additionalProperties: false
      required: [status, migrationVersion]
      properties:
        status:
          type: string
          enum: [ok, error]
        migrationVersion:
          type: [integer, "null"]
          description: >-
            The most recently applied forward-only migration version
            (see apps/galley/internal/migrations), or null if it could
            not be determined -- either because the database is
            unreachable (status "error") or because no migration has
            been applied yet on an otherwise-reachable database
            (status "ok").
        error:
          type: string
          description: >-
            Present only when status is "error". A short, fixed,
            non-secret explanation -- never the underlying driver error
            text or any part of the connection string.
    DiagnosticNote:
      type: object
      description: >-
        Development-only diagnostic record (issue #52), persisted in
        the diagnostic_notes table. Not a domain/ticket concept.
      additionalProperties: false
      required: [id, note, createdAt]
      properties:
        id:
          type: integer
        note:
          type: string
        createdAt:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp of when the note was persisted.
          x-go-type: string
    DiagnosticNoteList:
      type: object
      additionalProperties: false
      required: [notes]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticNote"
    CreateDiagnosticNoteRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
    RunnerHealthState:
      type: string

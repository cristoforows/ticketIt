            GET /api/tickets/{id}. Non-sequential and non-guessable --
            never the internal sequential database id, which no Galley
            endpoint exposes.
          # A plain Go string, not oapi-codegen's default UUID type:
          # keeps parsing/validation (and folding a malformed value
          # into the same 404 as "not found") in the hand-rolled
          # handler, matching this contract's existing convention of
          # format/length being documentation, not generated-code
          # enforcement (see CreateTicketRequest.title's maxLength).

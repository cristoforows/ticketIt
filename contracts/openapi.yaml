            or a URL) with no format enforced yet. Always present on
            the wire; "" means never set or cleared -- see `goal`'s
            description for the same convention.
        createdAt:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp of when the Ticket was captured.
          x-go-type: string
        updatedAt:
          type: string
          format: date-time
          description: >-
            RFC3339 UTC timestamp of the Ticket's last change. Equal to
            createdAt until a transition (#60) or a refinement edit
            (#58) changes it.
          x-go-type: string

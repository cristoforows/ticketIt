      properties:
        id: {type: string, format: uuid, x-go-type: string}
        title: {type: string}
        goal: {type: string}
        context: {type: string}
        successCriteria: {type: string}
        constraints: {type: string}
        repository: {type: string}
    RoundEventType:
      type: string
      description: Grows by slice.
      enum: [execution_started, progress, usage_observed, delivered, stop_confirmed]

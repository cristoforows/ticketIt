# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/OpenAPI-Specification/main/schemas/v3.1/schema.json
#
# Single source of truth for Galley's HTTP API: Galley's server types
# and Swiftlet's client types are both generated from this file. See
# contracts/README.md for the contract-first convention and the
# regeneration commands.
openapi: 3.1.0
info:
  title: ticketIt Galley API
  version: "0.1.0"
  description: >-
    Galley is the sole authority over ticketIt's authoritative records
    (docs/adr/0001-single-authority-galley.md). This document covers the
    subset of its HTTP API that has shipped so far.
servers:
  - url: /
    description: Same-origin — Galley directly, or Swiftlet's dev-server proxy for /api/*.
paths:
  /api/status:
    get:
      operationId: getStatus
      summary: Application status
      description: >-
        Fixed, unauthenticated status payload. `application` and `status`
        are constant; `version` and `environment` come from Galley's
        configuration; `startedAt` is the process start time, captured
        once. Additive-only: fields are never renamed or removed.
        `database` was added by issue #52 and reflects a live check made
        while handling this request, not a cached boot-time snapshot.
      responses:
        "200":
          description: Galley is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        default:
          description: >-
            Error. Every Galley error response uses this shape, including
            ones with no operation of their own (unmatched route,
            disallowed method).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/dev/diagnostic-notes:
    get:
      operationId: listDiagnosticNotes
      summary: List development diagnostic notes
      tags: [dev-diagnostic]
      description: >-
        Development-only diagnostic (issue #52): lists every persisted
        diagnostic note, oldest first. Proves data survives a Galley
        restart against the same database. These routes are gated at
        route registration and do not exist when `GALLEY_ENVIRONMENT`
        is `production` — an unmatched request there returns the same
        `404 not_found` shape as any other unknown route.
      responses:
        "200":
          description: The persisted diagnostic notes, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticNoteList"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: createDiagnosticNote
      summary: Persist a development diagnostic note
      tags: [dev-diagnostic]
      description: >-
        Development-only diagnostic (issue #52): persists one note.
        Gated the same way as the GET above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiagnosticNoteRequest"
      responses:
        "201":
          description: The persisted diagnostic note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticNote"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/github/start:
    get:
      operationId: startGithubOAuth
      summary: Begin GitHub OAuth sign-in
      tags: [auth]
      description: >-
        Redirects the browser to the configured GitHub OAuth provider's
        authorize endpoint (`GALLEY_OAUTH_GITHUB_BASE_URL`). Issues a
        fresh, high-entropy `state`, persists a hash of it with a short
        expiry, and binds it to this browser via a short-lived,
        HttpOnly `state` cookie -- the callback rejects any request
        whose `state` query parameter does not match both that cookie
        and the persisted record, which is what defeats replay and
        cross-session use. Unauthenticated by design: this is how a
        session is obtained in the first place.
      responses:
        "302":
          description: >-
            Redirect to the provider's authorize endpoint. Sets the
            `state` cookie.
          headers:
            Location:
              schema: {type: string}
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/auth/github/callback:
    get:
      operationId: completeGithubOAuth
      summary: Complete GitHub OAuth sign-in
      tags: [auth]
      description: >-
        Validates `state` against the cookie set by the start endpoint
        and the persisted record -- rejecting a missing, mismatched,
        expired, or already-used value with `invalid_oauth_state` --
        then exchanges `code` for an access token, fetches the identity
        from the provider, and compares it to the configured Owner. A
        non-owner identity is rejected with `owner_mismatch`: no
        session, Owner record, or link is created or modified. The
        access token is discarded immediately after fetching the
        identity: never stored, never reused for any provider API call
        (see docs/evidence/m2/54-oauth-session.md). On success, creates
        or verifies the linked Owner identity -- matching the immutable
        provider account id, not the login -- persists a new session,
        sets the session cookie, and redirects to the application root.
      parameters:
        - name: code
          in: query
          required: false
          schema: {type: string}
        - name: state
          in: query
          required: false
          schema: {type: string}
        - name: error
          in: query
          required: false
          description: >-
            Present when the provider itself reports failure (e.g. the
            user denied authorization).
          schema: {type: string}
      responses:
        "302":
          description: >-
            Sign-in succeeded. Sets the session cookie and redirects to
            the application root.
          headers:
            Location:
              schema: {type: string}
        default:
          description: >-
            Error. See `ErrorBody`. Includes `invalid_oauth_state`,
            `owner_mismatch`, and `oauth_provider_error` -- see
            apps/galley/README.md, "Error shape."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/tickets:
    get:
      operationId: listTickets
      summary: List the signed-in Owner's Tickets
      tags: [tickets]
      description: >-
        Returns the signed-in Owner's unarchived Tickets by default, or
        archived Tickets when archived=true, optionally matching any
        selected Badge (OR, with each Ticket returned once). Unknown,
        malformed, or foreign Badge ids return 400 invalid_request.
        Results are ordered by createdAt descending with id descending as
        the deterministic tiebreak (createdAt alone is not unique --
        see apps/galley/README.md, "Ticket ordering"). Requires a
        valid session; returns `401 unauthenticated` otherwise.
      parameters:
        - name: archived
          in: query
          description: True selects archived Tickets instead of unarchived Tickets.
          schema: {type: boolean, default: false}
        - name: badgeId
          in: query
          description: Repeat to match any selected Badge; omit for all Tickets.
          schema:
            type: array
            items: {type: string, format: uuid, x-go-type: string}
          style: form
          explode: true
      responses:
        "200":
          description: The Owner's Tickets, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketList"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: createTicket
      summary: Capture a Ticket from a title, optionally with details
      tags: [tickets]
      description: >-
        Creates a Ticket owned by the signed-in Owner, in Backlog
        (issue #56: title-only quick capture --
        docs/ticket-creation.md, "Quick capture"). `title` is required,
        is trimmed of leading/trailing whitespace, and must be
        non-empty and at most 200 characters after trimming;
        violations return `invalid_request`. No work-type or category
        is accepted or stored -- Tickets stay generic
        (docs/ticket-creation.md, "Flexible ticket structure"). Requires
        a valid session; returns `401 unauthenticated` otherwise.


        `template` (issue #59) is optional and defaults to `Basic` when
        absent; a title alone is sufficient to capture either Template.
        `completionCondition` is derived from the chosen Template's
        default exactly once, here at creation, and stored as its own
        field -- see `TicketCompletionCondition`.


        The manual refinement fields are optional and stored in the same
        insert; an invalid one creates nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: The persisted Ticket, in Backlog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/tickets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          # Kept a plain Go string (see Ticket.id's own x-go-type):
          # the handler validates and rejects a malformed value
          # itself, folding it into the same 404 as "not found"
          # rather than a generated binding error in a different
          # shape. See apps/galley/README.md, "Tickets", "Public
          # identifier".
          x-go-type: string
    get:
      operationId: getTicket
      summary: Get one Ticket by its identifier
      tags: [tickets]
      description: >-
        Returns one Ticket belonging to the signed-in Owner, addressed
        by its opaque public identifier (issue #57) -- never the
        internal sequential database id, which no Galley endpoint
        exposes. An unknown identifier, a malformed identifier, and an
        identifier belonging to another Owner all return the same
        404 not_found -- this endpoint never reveals that a record
        exists but belongs to someone else. Requires a valid session;
        returns 401 unauthenticated otherwise.
      responses:
        "200":
          description: The Ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      operationId: updateTicket
      summary: Partially update a Ticket's manual refinement fields
      tags: [tickets]
      description: >-
        Manual refinement (issue #58, docs/ticket-creation.md, "Manual
        guidance"): edits title, goal, context, successCriteria,
        constraints, and/or repository (issue #59) by hand. No AI of
        any kind, and this triggers nothing else. This is a genuine
        partial update, not a replace-whole-resource PUT: a property
        absent from the request body leaves the stored value unchanged;
        a property present and set to "" clears the stored value (title
        excepted -- see below); a property present with text is trimmed
        and stored. Every property here is therefore optional at the
        schema level (never listed under `required`) so "absent" and
        "present as an empty string" stay distinguishable on the wire,
        and so generated Go clients bind each one through a pointer --
        see UpdateTicketRequest.

        `title` cannot be cleared: a value that trims to empty is
        rejected with `invalid_request`, since every Ticket must keep a
        title. Every field here is trimmed of leading/trailing
        whitespace before validation or storage, exactly like
        CreateTicketRequest.title -- a value that trims to only
        whitespace is treated as an explicit empty string (i.e. it
        clears goal/context/successCriteria/constraints/repository, and
        is rejected for title).

        On a Ready, Agent-assigned Ticket, clearing an
        AgentReadinessInput that Agent needs is rejected with
        `agent_readiness_incomplete` and no field is updated.

        `template` is present in this request schema only so a client
        request naming it can be told apart from one that does not --
        it is never accepted. Changing a Ticket's Template after
        creation is out of scope for M2 (post-delivery Template/repository
        change is D4, owned by M8): a request naming `template` at all,
        any value included, is rejected with `invalid_request` and no
        field is updated. `completionCondition` has no corresponding
        request field anywhere in this contract -- it cannot be set or
        changed through this or any other operation once a Ticket is
        created (issue #59, D3).

        Concurrent-edit rule: last-write-wins, with no optimistic
        concurrency check (no version token, no ETag/If-Match). Two
        PATCH requests touching disjoint fields both apply, since each
        only ever touches the fields it names; two PATCH requests
        naming the same field apply in whichever order Galley processes
        them, and the later one's value silently wins -- there is no
        conflict detection. See apps/galley/README.md, "Manual
        refinement fields," for the full reasoning.

        Requires a valid session; returns 401 unauthenticated otherwise.
        An unknown identifier, a malformed identifier, and an
        identifier belonging to another Owner all return the same
        404 not_found, exactly like GET on this same path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketRequest"
      responses:
        "200":
          description: The updated Ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/tickets/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid, x-go-type: string}
    post:
      operationId: changeTicketStatus
      summary: Change a Ticket's Status
      tags: [tickets]
      description: >-
        A human-assigned lifecycle transition, implementing D3 S2's
        table (docs/decisions/d3-agent-template-compatibility.md).
        Validated against the Ticket's persisted current Status inside
        one transaction, so of two concurrent conflicting requests at
        most one applies.

        `Done` is always rejected here, whatever the current Status:
        it is reachable only through `POST /api/tickets/{id}/accept`,
        so completion cannot happen by accident.

        Any move off D3 S2's table is rejected with
        `invalid_transition`; notably `Blocked` resumes only to
        `InProgress`, never straight to `Ready`.

        On an Agent-assigned Ticket, `InProgress`, `InReview` and
        `Blocked` are rejected with `agent_owned_transition` (D3 S4),
        and `Ready` with `agent_readiness_incomplete` while an
        AgentReadinessInput is missing.

        Creates no Round, work request, or queue entry. Requires a
        valid session; returns `401 unauthenticated` otherwise.
        Identifier handling matches the other `/api/tickets/{id}`
        operations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeTicketStatusRequest"
      responses:
        "200":
          description: The Ticket, with its new Status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        default:
          description: >-
            Error. See `ErrorBody`. Includes `invalid_transition`,
            `agent_owned_transition` and `agent_readiness_incomplete`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/tickets/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid, x-go-type: string}
    post:
      operationId: acceptTicket
      summary: Accept a Ticket's delivered work, completing it
      tags: [tickets]
      description: >-
        The one path to `Done`, kept a separate command rather than a
        Status write to respect the Swiftlet -> Galley owner-command
        boundary (docs/contracts/execution-interface.md).

        Requires the Ticket to be `InReview`; otherwise
        `invalid_transition`, validated against the persisted Status
        the same way `changeTicketStatus` is.

        A Ticket whose retained completion condition is
        `reviewedPrMerge` is rejected with
        `reviewed_pr_merge_not_implemented` rather than downgraded: D2
        is unresolved and the mechanism it selects is owned by M8
        (docs/decisions/d3-agent-template-compatibility.md, "Completing
        human work that requires a reviewed PR merge").

        Creates no Round, work request, or queue entry. Requires a
        valid session; returns `401 unauthenticated` otherwise.
        Identifier handling matches the other `/api/tickets/{id}`
        operations.
      responses:
        "200":
          description: The Ticket, now Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        default:
          description: >-
            Error. See `ErrorBody`. Includes `invalid_transition` (the
            Ticket is not In Review) and
            `reviewed_pr_merge_not_implemented` (D2/M8 limitation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/tickets/{id}/assignee:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid, x-go-type: string}
    put:
      operationId: assignTicket
      summary: Assign the signed-in Owner or one of the Owner's Agents
      tags: [tickets]
      description: >-
        Idempotent, and allowed whatever the Ticket's current Status or
        Template (D3 S1), except that assigning an Agent to a Ready
        Ticket missing an AgentReadinessInput that Agent needs is
        rejected with `agent_readiness_incomplete`. Reassignment keeps
        the Ticket's history and completion condition. An unknown, malformed or foreign Ticket or
        Agent id returns the shared 404 not_found.

        Creates no Round, work request, or queue entry. Requires a
        valid session; returns `401 unauthenticated` otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTicketRequest"
      responses:
        "200":
          description: The Ticket with its new Assignee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      operationId: unassignTicket
      summary: Clear a Ticket's Assignee
      tags: [tickets]
      description: >-
        Idempotent: unassigning an already-unassigned Ticket returns
        200, matching this contract's last-write-wins conventions
        elsewhere. Allowed whatever the current Status.

        Requires a valid session; returns `401 unauthenticated`
        otherwise. Identifier handling matches the other
        `/api/tickets/{id}` operations.
      responses:
        "200":
          description: The Ticket, now unassigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/badges:
    get:
      operationId: listBadges
      summary: List the Owner's Badges
      tags: [badges]
      description: Ordered by case-insensitive name ascending, then id ascending.
      responses:
        "200":
          description: The Owner's reusable Badges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeList"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: createBadge
      summary: Create a reusable Badge
      tags: [badges]
      description: >-
        Names are trimmed, non-empty, at most 80 characters after trimming,
        and unique per Owner case-insensitively. Duplicate names return
        409 duplicate_badge_name, including under concurrent creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBadgeRequest"
      responses:
        "201":
          description: The created Badge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Badge"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/agents:
    get:
      operationId: listAgents
      summary: List the Owner's Agents
      tags: [agents]
      description: Ordered by case-insensitive name ascending, then id ascending.
      responses:
        "200":
          description: The Owner's Agents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      operationId: createAgent
      summary: Create an Agent
      tags: [agents]
      description: >-
        Names are trimmed, non-empty, at most 80 characters after trimming,
        and unique per Owner case-insensitively. Duplicate names return
        409 duplicate_agent_name, including under concurrent creation.
        `kind` is fixed at creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: The created Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid, x-go-type: string}
    patch:
      operationId: renameAgent
      summary: Rename an Agent
      tags: [agents]
      description: >-
        Same name rules as `createAgent`; renaming to the Agent's own name
        in a different case is allowed. An unknown, malformed or foreign id
        returns the shared 404 not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameAgentRequest"
      responses:
        "200":
          description: The renamed Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/tickets/{id}/badges/{badgeId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid, x-go-type: string}
      - name: badgeId
        in: path
        required: true
        schema: {type: string, format: uuid, x-go-type: string}
    put:
      operationId: attachTicketBadge
      summary: Attach an existing Badge to a Ticket
      tags: [badges, tickets]
      description: >-
        Idempotent. Returns the Ticket with its Badges; an unknown, malformed,
        or foreign Ticket or Badge id returns the shared 404 not_found.
      responses:
        "200":
          description: The Ticket with the Badge attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      operationId: detachTicketBadge
      summary: Remove a Badge from a Ticket
      tags: [badges, tickets]
      description: >-
        Idempotent if the Ticket does not carry the Badge. The reusable Badge
        remains in the library. An unknown, malformed, or foreign Ticket or
        Badge id returns the shared 404 not_found.
      responses:
        "200":
          description: The Ticket after removing the Badge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/tickets/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid, x-go-type: string}
    post:
      operationId: archiveTicket
      summary: Archive a Ticket
      tags: [tickets]
      description: >-
        Retains the Ticket, its Status and Badges while removing it from
        default collections. A second archive is rejected with
        archived_ticket; an unknown, malformed or foreign id returns 404.
      responses:
        "200":
          description: The archived Ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/tickets/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid, x-go-type: string}
    post:
      operationId: restoreTicket
      summary: Restore an archived Ticket
      tags: [tickets]
      description: >-
        Restoring Ready changes Status to Backlog; every other Status is
        retained. A Ticket not archived returns 400 not_archived; an unknown,
        malformed or foreign id returns the shared 404. Does not start work.
      responses:
        "200":
          description: The restored Ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/session:
    get:
      operationId: getSession
      summary: The signed-in Owner
      tags: [auth]
      description: >-
        Requires a valid session; returns `401 unauthenticated`
        otherwise, in the shared error shape. Unlike `/api/status`,
        this route is never public.
      responses:
        "200":
          description: A session is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      operationId: signOut
      summary: Sign out
      tags: [auth]
      description: >-
        Revokes the current session (deletes its persisted record) and
        clears the session cookie. Requires a valid session; returns
        `401 unauthenticated` otherwise.
      responses:
        "204":
          description: Session revoked.
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/runner-credential:
    post:
      operationId: pairRunner
      summary: Pair a runner
      tags: [runner]
      description: >-
        Issues a new runner credential and revokes the Owner's previous
        one. `token` appears in this response only; Galley stores its
        SHA-256 hash.
      responses:
        "201":
          description: The new credential and the resulting runner health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerPairing"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      operationId: revokeRunner
      summary: Revoke the runner credential
      tags: [runner]
      description: Idempotent; succeeds when nothing is paired.
      responses:
        "204":
          description: No runner credential remains.
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/runner-health:
    get:
      operationId: getRunnerHealth
      summary: Runner health
      tags: [runner]
      description: >-
        Derived on read from `lastSeenAt` and Galley's clock: `connected`
        while the last heartbeat is under 30 s old, `disconnected` after
        that or before the first one, `not_paired` without a credential.
        Never changes a Ticket or its Status.
      responses:
        "200":
          description: The Owner's runner health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerHealth"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/runner/register:
    post:
      operationId: registerRunner
      summary: Register a runner
      tags: [runner-api]
      description: >-
        Called by Michelin on start. Also counts as a heartbeat. Every
        `/api/runner/` route requires the runner credential as a bearer
        token and rejects an Owner session cookie with the shared `401`.
      security:
        - runnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRunnerRequest"
      responses:
        "200":
          description: The runner is registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerRegistration"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/runner/heartbeat:
    post:
      operationId: runnerHeartbeat
      summary: Runner heartbeat
      tags: [runner-api]
      description: >-
        Records last-seen. A credential that has not registered since it
        was issued returns `409 runner_not_registered`.
      security:
        - runnerBearer: []
      responses:
        "200":
          description: Last-seen recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerHeartbeat"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/dev/clock/advance:
    post:
      operationId: advanceDevClock
      summary: Advance Galley's clock
      tags: [dev-diagnostic]
      description: >-
        Development-only, gated like the diagnostic notes. Moves the
        clock runner health reads forward, for the browser suite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceDevClockRequest"
      responses:
        "200":
          description: Galley's clock after the advance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevClock"
        default:
          description: Error. See `ErrorBody`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  securitySchemes:
    runnerBearer:
      type: http
      scheme: bearer
      description: A runner credential, `tir_` followed by 43 base64url characters.
  schemas:
    Owner:
      type: object
      description: >-
        ticketIt's stable internal Owner identity -- independent of any
        GitHub identifier (docs/deployment.md, "Ownership and
        sign-in"). `login` is the linked GitHub identity's most
        recently observed login, shown for display only: matching a
        sign-in to this Owner always uses the immutable provider
        account id, never this field.
      additionalProperties: false
      required: [id, login]
      properties:
        id:
          type: integer
          description: ticketIt's own Owner id -- not a GitHub identifier.
        login:
          type: string
          description: The linked GitHub account's current login, for display only.
    SessionResponse:
      type: object
      additionalProperties: false
      required: [owner]
      properties:
        owner:
          $ref: "#/components/schemas/Owner"
    TicketStatus:
      type: string
      description: >-
        A Ticket's lifecycle stage (CONTEXT.md, "Status"). Moves
        between these values are validated against the persisted
        current Status per D3 S2
        (docs/decisions/d3-agent-template-compatibility.md). `Done` is
        reachable only through explicit Accept.
      enum: [Backlog, Ready, InProgress, Blocked, InReview, Done]
    TicketTemplate:
      type: string
      description: >-
        A Ticket's built-in Template (issue #59), chosen at capture
        (default Basic). Under the accepted D3 decision
        (docs/decisions/d3-agent-template-compatibility.md), a Template
        supplies presentation, required information, and a *default*
        completion condition only -- it never restricts which Agent or
        execution engine may be assigned (docs/ticket-creation.md,
        "Flexible ticket structure"). Changing a Ticket's Template after
        creation is out of scope for M2: post-delivery Template/repository
        change is D4, owned by M8.
      enum: [Basic, Coding]
    TicketCompletionCondition:
      type: string
      description: >-
        The condition that completes a Ticket (CONTEXT.md, "Done"):
        human acceptance, or merging its reviewed pull request. Derived
        from the Ticket's Template default exactly once, at creation
        (issue #59, D3) -- there is no request field or operation
        anywhere in this contract that sets or changes it directly.
        Assignment, reassignment, and editing any other field never
        change it.
      enum: [humanAcceptance, reviewedPrMerge]
    TicketAssigneeType:
      type: string
      description: >-
        The kind of Assignee responsible for a Ticket (CONTEXT.md,
        "Assignee"). "" means unassigned, always present on the wire,
        matching `goal`'s convention.
      enum: [owner, agent, ""]
    TicketAssigneeAgent:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: {type: string, format: uuid, x-go-type: string}
        name: {type: string}
        kind:
          $ref: "#/components/schemas/AgentKind"
    AssignTicketRequest:
      type: object
      description: '`agentId` is required when `type` is `agent` and rejected otherwise.'
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [owner, agent]
        agentId: {type: string, format: uuid, x-go-type: string}
    AgentKind:
      type: string
      description: Set at creation and never changed in M4.
      enum: [research, coding]
      # Without these, "coding" collides with TicketTemplate's Coding and
      # oapi-codegen renames both enums' constants.
      x-enum-varnames: [AgentKindResearch, AgentKindCoding]
    AgentReadinessInput:
      type: string
      description: >-
        A Ticket field an Agent-assigned Ticket needs before Ready (D3
        S1): `goal` and `successCriteria` always, `repository` for a
        `coding` Agent.
      enum: [goal, successCriteria, repository]
      x-enum-varnames: [AgentReadinessInputGoal, AgentReadinessInputSuccessCriteria, AgentReadinessInputRepository]
    Agent:
      type: object
      additionalProperties: false
      required: [id, name, kind, createdAt]
      properties:
        id: {type: string, format: uuid, x-go-type: string}
        name: {type: string}
        kind:
          $ref: "#/components/schemas/AgentKind"
        createdAt: {type: string, format: date-time, x-go-type: string}
    AgentList:
      type: object
      additionalProperties: false
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        kind:
          $ref: "#/components/schemas/AgentKind"
    RenameAgentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
    Ticket:
      type: object
      description: >-
        ticketIt's first domain record (issue #56): a title captured in
        Backlog. No work-type/category column -- see
        docs/ticket-creation.md, "Flexible ticket structure". Owned by
        exactly one Owner, enforced by Galley (docs/adr/0001-single-authority-galley.md).
        Addressed by an opaque, non-sequential public identifier (issue
        #57) -- see `id` below.
      additionalProperties: false
      required:
        [
          id,
          title,
          status,
          allowedActions,
          badges,
          archivedAt,
          template,
          completionCondition,
          assigneeType,
          assigneeAgent,
          requestingAgentWork,
          goal,
          context,
          successCriteria,
          constraints,
          repository,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Opaque public identifier (issue #57), used in URLs and by
            GET /api/tickets/{id}. Non-sequential and non-guessable --
            never the internal sequential database id, which no Galley
            endpoint exposes.
          # A plain Go string, not oapi-codegen's default UUID type:
          # keeps parsing/validation (and folding a malformed value
          # into the same 404 as "not found") in the hand-rolled
          # handler, matching this contract's existing convention of
          # format/length being documentation, not generated-code
          # enforcement (see CreateTicketRequest.title's maxLength).
          x-go-type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/TicketStatus"
        allowedActions:
          $ref: "#/components/schemas/TicketAllowedActions"
        badges:
          type: array
          description: Ordered by case-insensitive name ascending, then id ascending. Empty when none attached.
          items:
            $ref: "#/components/schemas/TicketBadge"
        archivedAt:
          type: [string, "null"]
          format: date-time
          description: Null for an active Ticket; RFC3339 UTC archive timestamp otherwise. Status is retained separately.
        template:
          $ref: "#/components/schemas/TicketTemplate"
        assigneeType:
          $ref: "#/components/schemas/TicketAssigneeType"
        assigneeAgent:
          description: Null unless `assigneeType` is `agent`.
          oneOf:
            - $ref: "#/components/schemas/TicketAssigneeAgent"
            - type: "null"
        requestingAgentWork:
          type: boolean
          description: >-
            Unarchived, Ready, Agent-assigned, and every
            AgentReadinessInput that Agent needs is present. Creates no
            Round by itself.
        completionCondition:
          $ref: "#/components/schemas/TicketCompletionCondition"
        goal:
          type: string
          description: >-
            Manual refinement (issue #58, docs/ticket-creation.md,
            "Manual guidance" -- prompt "What outcome do you want?").
            Plain text, never Markdown (M7 owns report rendering).
            Always present on the wire; "" means never set or cleared
            -- read access never distinguishes those two, only PATCH's
            request body does (see UpdateTicketRequest).
        context:
          type: string
          description: >-
            Manual refinement (issue #58 -- prompt "Supply relevant
            background, links, repositories, or examples."). Plain
            text; see `goal`'s description for the "" convention.
        successCriteria:
          type: string
          description: >-
            Manual refinement (issue #58 -- prompt "Describe observable
            conditions that demonstrate the outcome was achieved.").
            CONTEXT.md's "Success Criteria" term -- not "acceptance
            criteria". Plain text; see `goal`'s description for the ""
            convention.
        constraints:
          type: string
          description: >-
            Manual refinement (issue #58 -- prompt "State what must
            stay unchanged or remain out of scope."). Plain text; see
            `goal`'s description for the "" convention.
        repository:
          type: string
          description: >-
            One Ticket repository reference (issue #59, D3 S1 check 3),
            available on either Template, and required before Ready only
            by a `coding` Agent's readiness. There is exactly one such field on a Ticket; the Coding
            Template surfaces it by default, but it is not a competing
            Basic-only concept. Plain text (e.g. an "owner/repo" name
            or a URL) with no format enforced yet. Always present on
            the wire; "" means never set or cleared -- see `goal`'s
            description for the same convention.
        createdAt:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp of when the Ticket was captured.
          x-go-type: string
        updatedAt:
          type: string
          format: date-time
          description: >-
            RFC3339 UTC timestamp of the Ticket's last change. Equal to
            createdAt until a transition (#60) or a refinement edit
            (#58) changes it.
          x-go-type: string
    TicketList:
      type: object
      description: >-
        The signed-in Owner's Tickets, newest first (createdAt
        descending, id descending as the tiebreak).
      additionalProperties: false
      required: [tickets]
      properties:
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
    TicketBadge:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid, x-go-type: string}
        name: {type: string}
    Badge:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id: {type: string, format: uuid, x-go-type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time, x-go-type: string}
    BadgeList:
      type: object
      additionalProperties: false
      required: [badges]
      properties:
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
    CreateBadgeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
    TicketAllowedActions:
      type: object
      additionalProperties: false
      required: [statusChanges, statusChangeRejections, accept]
      properties:
        statusChanges:
          type: array
          description: Targets accepted by a plain status command from this Ticket's current Status.
          items:
            $ref: "#/components/schemas/TicketStatus"
        statusChangeRejections:
          type: array
          description: >-
            Targets D3 S2's table permits from the current Status that
            this Ticket's Agent assignment or missing inputs rule out,
            each with the status command's error.
          items:
            $ref: "#/components/schemas/TicketStatusChangeRejection"
        accept:
          $ref: "#/components/schemas/TicketAcceptAvailability"
    TicketStatusChangeRejection:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
        reason:
          $ref: "#/components/schemas/ErrorDetail"
    TicketAcceptAvailability:
      type: object
      additionalProperties: false
      required: [available]
      not:
        anyOf:
          - properties:
              available:
                const: false
            not:
              required: [reason]
          - properties:
              available:
                const: true
            required: [reason]
      properties:
        available:
          type: boolean
        reason:
          description: Required when unavailable; absent when available. Matches the Accept command's error.
          $ref: "#/components/schemas/ErrorDetail"
    CreateTicketRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          description: >-
            Trimmed of leading/trailing whitespace before validation.
            Must be non-empty and at most 200 characters after
            trimming.
          minLength: 1
          maxLength: 200
        template:
          $ref: "#/components/schemas/TicketTemplate"
        goal:
          type: string
          description: Same trimming and limit as `UpdateTicketRequest.goal`; omitted or empty leaves it unset.
          maxLength: 2000
        context:
          type: string
          description: Same as `goal`.
          maxLength: 10000
        successCriteria:
          type: string
          description: Same as `goal`.
          maxLength: 2000
        constraints:
          type: string
          description: Same as `goal`.
          maxLength: 2000
        repository:
          type: string
          description: Same as `goal`.
          maxLength: 500
    UpdateTicketRequest:
      type: object
      description: >-
        Manual refinement (issue #58): a genuine partial update. Every
        property is optional -- none are listed under `required` -- so
        a client can distinguish "this property was not part of the
        request" (leave unchanged) from "this property was sent as an
        empty string" (clear it, title excepted). See the `patch
        /api/tickets/{id}` operation above for the full rule, including
        why title cannot be cleared, and apps/galley/README.md, "Manual
        refinement fields," for the concurrent-edit (last-write-wins)
        rule. Trimmed of leading/trailing whitespace the same way
        CreateTicketRequest.title is; the maxLength values below apply
        after trimming and are counted in characters (code points), not
        bytes -- see apps/galley/README.md, "Tickets," "Title
        validation."
      additionalProperties: false
      properties:
        title:
          type: string
          description: >-
            If present, trimmed and validated exactly like
            CreateTicketRequest.title. A value that trims to empty is
            rejected with invalid_request rather than clearing the
            title -- every Ticket must keep one. Absent leaves the
            title unchanged.
          maxLength: 200
        goal:
          type: string
          description: >-
            Manual guidance: "What outcome do you want?"
            (docs/ticket-creation.md). Absent leaves the stored value
            unchanged; present as "" (or a value that trims to "")
            clears it; present with text trims and stores it.
          maxLength: 2000
        context:
          type: string
          description: >-
            Manual guidance: "Supply relevant background, links,
            repositories, or examples." Same absent/empty/text rule as
            `goal`.
          maxLength: 10000
        successCriteria:
          type: string
          description: >-
            Manual guidance: "Describe observable conditions that
            demonstrate the outcome was achieved." Same
            absent/empty/text rule as `goal`. Agent-readiness
            validation of this field is M4's, not this slice's.
          maxLength: 2000
        constraints:
          type: string
          description: >-
            Manual guidance: "State what must stay unchanged or remain
            out of scope." Same absent/empty/text rule as `goal`.
          maxLength: 2000
        repository:
          type: string
          description: >-
            One Ticket repository reference (issue #59, D3), available
            on either Template. Same absent/empty/text rule as `goal`.
          maxLength: 500
        # Never accepted: naming this property at all -- present with
        # any value, including the Ticket's current one -- is rejected
        # with invalid_request. Changing a Ticket's Template after
        # creation is out of scope for M2 (D4, M8). See the
        # `patch /api/tickets/{id}` operation description above.
        template:
          $ref: "#/components/schemas/TicketTemplate"
    ChangeTicketStatusRequest:
      type: object
      description: >-
        `status` names the requested target Status, validated against
        the Ticket's persisted current Status per D3 S2. `Done` is
        always rejected here -- see `POST /api/tickets/{id}/accept`.
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
    StatusResponse:
      type: object
      description: The fixed GET /api/status payload.
      additionalProperties: false
      required: [application, status, version, environment, startedAt, database]
      properties:
        application:
          type: string
          const: galley
        status:
          type: string
          const: ok
        version:
          type: string
          description: Galley's configured version string (GALLEY_VERSION).
        environment:
          type: string
          enum: [development, production]
        startedAt:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp, captured once at process start.
          # Keeps this a Go string. Left alone, date-time maps to
          # time.Time, whose RFC3339Nano marshaling can add fractional
          # seconds and change the response bytes.
          x-go-type: string
        database:
          $ref: "#/components/schemas/DatabaseStatus"
    DatabaseStatus:
      type: object
      description: >-
        Added by issue #52. Reachability and applied migration version,
        checked live on every request -- never cached from process
        start, and never reported as "ok" when the database is
        unreachable.
      additionalProperties: false
      required: [status, migrationVersion]
      properties:
        status:
          type: string
          enum: [ok, error]
        migrationVersion:
          type: [integer, "null"]
          description: >-
            The most recently applied forward-only migration version
            (see apps/galley/internal/migrations), or null if it could
            not be determined -- either because the database is
            unreachable (status "error") or because no migration has
            been applied yet on an otherwise-reachable database
            (status "ok").
        error:
          type: string
          description: >-
            Present only when status is "error". A short, fixed,
            non-secret explanation -- never the underlying driver error
            text or any part of the connection string.
    DiagnosticNote:
      type: object
      description: >-
        Development-only diagnostic record (issue #52), persisted in
        the diagnostic_notes table. Not a domain/ticket concept.
      additionalProperties: false
      required: [id, note, createdAt]
      properties:
        id:
          type: integer
        note:
          type: string
        createdAt:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp of when the note was persisted.
          x-go-type: string
    DiagnosticNoteList:
      type: object
      additionalProperties: false
      required: [notes]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticNote"
    CreateDiagnosticNoteRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
    RunnerHealthState:
      type: string
      enum: [connected, disconnected, not_paired]
      x-enum-varnames: [RunnerConnected, RunnerDisconnected, RunnerNotPaired]
    RunnerHealth:
      type: object
      additionalProperties: false
      required: [state, checkedAt, pairedAt, registeredAt, lastSeenAt, michelinVersion, hostname]
      properties:
        state:
          $ref: "#/components/schemas/RunnerHealthState"
        checkedAt:
          type: string
          format: date-time
          description: Galley's clock when `state` was derived.
        pairedAt: {type: [string, "null"], format: date-time}
        registeredAt: {type: [string, "null"], format: date-time}
        lastSeenAt: {type: [string, "null"], format: date-time}
        michelinVersion: {type: [string, "null"]}
        hostname: {type: [string, "null"]}
    RunnerPairing:
      type: object
      additionalProperties: false
      required: [token, health]
      properties:
        token:
          type: string
          pattern: "^tir_[A-Za-z0-9_-]{43}$"
        health:
          $ref: "#/components/schemas/RunnerHealth"
    RegisterRunnerRequest:
      type: object
      additionalProperties: false
      required: [michelinVersion, hostname]
      properties:
        michelinVersion: {type: string, minLength: 1, maxLength: 64}
        hostname: {type: string, minLength: 1, maxLength: 253}
    RunnerRegistration:
      type: object
      additionalProperties: false
      required: [registeredAt]
      properties:
        registeredAt: {type: string, format: date-time}
    RunnerHeartbeat:
      type: object
      additionalProperties: false
      required: [lastSeenAt]
      properties:
        lastSeenAt: {type: string, format: date-time}
    AdvanceDevClockRequest:
      type: object
      additionalProperties: false
      required: [seconds]
      properties:
        seconds: {type: integer, minimum: 1, maximum: 86400}
    DevClock:
      type: object
      additionalProperties: false
      required: [now]
      properties:
        now: {type: string, format: date-time}
    ErrorBody:
      type: object
      description: The shared JSON error shape used by every Galley error response.
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Short, stable, snake_case identifier (e.g. "not_found").
        message:
          type: string
          description: Human-readable, non-secret explanation.
        missing:
          type: array
          description: Present only with `agent_readiness_incomplete`.
          minItems: 1
          items:
            $ref: "#/components/schemas/AgentReadinessInput"

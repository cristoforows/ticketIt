      type: string
      description: >-
        A Ticket's built-in Template (issue #59), chosen at capture
        (default Basic). Under the accepted D3 decision
        (docs/decisions/d3-agent-template-compatibility.md), a Template
        supplies presentation, required information, and a *default*
        completion condition only -- it never restricts which Agent or
        execution engine may be assigned (docs/ticket-creation.md,
        "Flexible ticket structure"). Changing a Ticket's Template after
        creation is out of scope for M2: post-delivery Template/repository
        change is D4, owned by M8.
      enum: [Basic, Coding]

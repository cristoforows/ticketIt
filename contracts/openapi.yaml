            convention.
        constraints:
          type: string
          description: >-
            Manual refinement (issue #58 -- prompt "State what must
            stay unchanged or remain out of scope."). Plain text; see
            `goal`'s description for the "" convention.
        repository:
          type: string
          description: >-
            One Ticket repository reference (issue #59, D3 S1 check 3),
            available on either Template, and required before Ready only
            by a `coding` Agent's readiness. There is exactly one such field on a Ticket; the Coding
            Template surfaces it by default, but it is not a competing

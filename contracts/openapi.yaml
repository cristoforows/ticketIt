        now: {type: string, format: date-time}
    ErrorBody:
      type: object
      description: The shared JSON error shape used by every Galley error response.
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Short, stable, snake_case identifier (e.g. "not_found").
        message:
          type: string
          description: Human-readable, non-secret explanation.
        missing:
          type: array
          description: Present only with `agent_readiness_incomplete`.
          minItems: 1
          items:
            $ref: "#/components/schemas/AgentReadinessInput"
        roundId:
          type: string
          format: uuid
          x-go-type: string
          description: Present only with `round_open`; the Ticket's open Round.

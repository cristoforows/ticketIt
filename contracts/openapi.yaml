      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
    TicketAllowedActions:
      type: object
      additionalProperties: false
      required: [statusChanges, statusChangeRejections, accept, rework, stop, answer, feedback, permissionDecision]
      properties:
        statusChanges:
          type: array
          description: Targets accepted by a plain status command from this Ticket's current Status.
          items:
            $ref: "#/components/schemas/TicketStatus"
        statusChangeRejections:
          type: array
          description: >-
            Targets D3 S2's table permits from the current Status that
            this Ticket's Agent assignment or missing inputs rule out,
            each with the status command's error.
          items:
            $ref: "#/components/schemas/TicketStatusChangeRejection"
        accept:
          $ref: "#/components/schemas/TicketCommandAvailability"
        rework:
          $ref: "#/components/schemas/TicketCommandAvailability"
        stop:
          description: Unavailable with `stop_already_requested` once Stop is requested.
          $ref: "#/components/schemas/TicketCommandAvailability"
        answer:
          description: >-
            Whether `openRound.question` can be answered. Unavailable with
            `answer_not_available` without one, `question_already_answered`
            once it is answered, and `stop_already_requested` once Stop is
            requested.
          $ref: "#/components/schemas/TicketCommandAvailability"
        feedback:
          description: Whether feedback can be added to `delivery.roundId`; otherwise `feedback_not_available`.
          $ref: "#/components/schemas/TicketCommandAvailability"
        permissionDecision:
          description: >-
            Whether `openRound.permissionRequest` can be approved or
            declined. Unavailable with `permission_decision_not_available`
            without one, `permission_already_decided` once it is decided,
            and `stop_already_requested` once Stop is requested.
          $ref: "#/components/schemas/TicketCommandAvailability"
    TicketStatusChangeRejection:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
        reason:
          $ref: "#/components/schemas/ErrorDetail"
    TicketCommandAvailability:
      type: object
      additionalProperties: false
      required: [available]

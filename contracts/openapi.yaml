        anyOf:
          - properties:
              available:
                const: false
            not:
              required: [reason]
          - properties:
              available:
                const: true
            required: [reason]
      properties:
        available:
          type: boolean
        reason:
          description: Required when unavailable; absent when available. Matches the command's error.
          $ref: "#/components/schemas/ErrorDetail"
    CreateTicketRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          description: >-
            Trimmed of leading/trailing whitespace before validation.
            Must be non-empty and at most 200 characters after
            trimming.
          minLength: 1
          maxLength: 200
        template:
          $ref: "#/components/schemas/TicketTemplate"
        goal:
          type: string
          description: Same trimming and limit as `UpdateTicketRequest.goal`; omitted or empty leaves it unset.
          maxLength: 2000
        context:
          type: string
          description: Same as `goal`.
          maxLength: 10000
        successCriteria:
          type: string
          description: Same as `goal`.
          maxLength: 2000
        constraints:
          type: string
          description: Same as `goal`.
          maxLength: 2000
        repository:
          type: string
          description: Same as `goal`.
          maxLength: 500
    UpdateTicketRequest:
      type: object
      description: >-
        Manual refinement (issue #58): a genuine partial update. Every
        property is optional -- none are listed under `required` -- so
        a client can distinguish "this property was not part of the
        request" (leave unchanged) from "this property was sent as an
        empty string" (clear it, title excepted). See the `patch
        /api/tickets/{id}` operation above for the full rule, including
        why title cannot be cleared, and apps/galley/README.md, "Manual
        refinement fields," for the concurrent-edit (last-write-wins)
        rule. Trimmed of leading/trailing whitespace the same way
        CreateTicketRequest.title is; the maxLength values below apply
        after trimming and are counted in characters (code points), not
        bytes -- see apps/galley/README.md, "Tickets," "Title
        validation."
      additionalProperties: false
      properties:
        title:
          type: string
          description: >-
            If present, trimmed and validated exactly like
            CreateTicketRequest.title. A value that trims to empty is
            rejected with invalid_request rather than clearing the
            title -- every Ticket must keep one. Absent leaves the
            title unchanged.
          maxLength: 200
        goal:
          type: string
          description: >-
            Manual guidance: "What outcome do you want?"
            (docs/ticket-creation.md). Absent leaves the stored value
            unchanged; present as "" (or a value that trims to "")
            clears it; present with text trims and stores it.
          maxLength: 2000
        context:
          type: string
          description: >-
            Manual guidance: "Supply relevant background, links,
            repositories, or examples." Same absent/empty/text rule as
            `goal`.
          maxLength: 10000
        successCriteria:
          type: string
          description: >-
            Manual guidance: "Describe observable conditions that
            demonstrate the outcome was achieved." Same
            absent/empty/text rule as `goal`. Agent-readiness
            validation of this field is M4's, not this slice's.
          maxLength: 2000
        constraints:
          type: string
          description: >-
            Manual guidance: "State what must stay unchanged or remain
            out of scope." Same absent/empty/text rule as `goal`.
          maxLength: 2000
        repository:
          type: string
          description: >-
            One Ticket repository reference (issue #59, D3), available
            on either Template. Same absent/empty/text rule as `goal`.
          maxLength: 500
        # Never accepted: naming this property at all -- present with
        # any value, including the Ticket's current one -- is rejected
        # with invalid_request. Changing a Ticket's Template after
        # creation is out of scope for M2 (D4, M8). See the
        # `patch /api/tickets/{id}` operation description above.
        template:
          $ref: "#/components/schemas/TicketTemplate"
